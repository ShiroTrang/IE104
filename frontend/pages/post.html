<!doctype html>
<html lang="vi">
  <head>
    <!-- Tài nguyên tĩnh và phông chung giữ nhận diện đồng nhất với các trang đã làm. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Đọc bài · Etsubi</title>
    <link rel="icon" type="image/svg+xml" href="/assets/icons/etsubi-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Sans+JP:wght@350;400;500;700&display=swap" />
    <link rel="stylesheet" href="/styles/main.css" />
    <link rel="stylesheet" href="/components/header/header.css" />
    <link rel="stylesheet" href="/components/footer/footer.css" />
    <link rel="stylesheet" href="/components/moderation/moderation.css" />
    <link rel="stylesheet" href="/styles/pages/post.css" />
    <script type="module" src="/pages/post.js"></script>
  </head>
  <body class="page page--post">
    <!-- Header do component dựng (tab Diễn đàn đang chọn, ô tìm kiếm trong suốt như Figma). -->
    <a class="skip-link" href="#main">Bỏ qua điều hướng</a>
    <header class="site-header" data-component="header" data-active="forum"></header>

    <main id="main" class="post-page">
      <!-- Cánh hoa trang trí hai bên lề, chỉ là ảnh tĩnh, trình đọc màn hình bỏ qua. -->
      <div class="post-page__petals" data-petals aria-hidden="true"></div>

      <div class="container post-page__inner">
        <!-- Đường dẫn vị trí: Diễn đàn › tiêu đề bài, giúp quay lại danh sách. -->
        <nav class="post-breadcrumb" aria-label="Vị trí trang">
          <ol class="post-breadcrumb__list">
            <li><a class="post-breadcrumb__link" href="/pages/forum.html">Diễn đàn</a></li>
            <li class="post-breadcrumb__current" aria-current="page" data-breadcrumb-title>
              <span class="u-placeholder-bar post-breadcrumb__placeholder" aria-hidden="true"></span>
            </li>
          </ol>
        </nav>

        <!-- Thông báo lỗi chung của trang (không tải được bài, lỗi mạng...). -->
        <p class="alert alert--error post-page__error" role="alert" data-page-error hidden></p>

        <div class="post-columns">
          <!-- Cột trái: khung bài viết gồm tác giả, nội dung, thao tác và thảo luận. -->
          <article class="post-article" data-article aria-busy="true" aria-labelledby="post-title">
            <!-- Khối chỉ Mod/Admin thấy khi bài đang bị ẩn hoặc đã xoá (Hiện lại / Khôi phục). -->
            <div class="post-article__staff" data-post-staff></div>

            <!-- Tác giả và ngày đăng: avatar chữ đầu, tên, cờ theo tiếng mẹ đẻ, ngày và thời gian đọc. -->
            <div class="post-author" data-author>
              <span class="post-author__avatar post-author__avatar--placeholder" aria-hidden="true"></span>
              <div class="post-author__info">
                <span class="u-placeholder-bar u-placeholder-bar--title post-author__bar"></span>
                <span class="u-placeholder-bar u-placeholder-bar--short"></span>
              </div>
            </div>

            <!-- Tiêu đề bài: phông Etsubi Display 40px; JS điền chữ thật sau khi tải. -->
            <h1 id="post-title" class="t-display post-article__title" data-title>
              <span class="u-placeholder-bar u-placeholder-bar--title post-article__title-bar" aria-hidden="true"></span>
              <span class="u-visually-hidden">Đang tải bài viết…</span>
            </h1>

            <!-- Nút dịch bài: gọi API dịch, bấm lần nữa để xem bản gốc. -->
            <div class="post-translate">
              <button type="button" class="post-translate__button" data-translate disabled aria-pressed="false">
                <svg class="post-translate__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/><path d="m22 22-5-10-5 10"/><path d="M14 18h6"/></svg>
                <span data-translate-label>Dịch bài viết</span>
              </button>
              <p class="post-translate__status" role="status" data-translate-status></p>
            </div>

            <!-- Thân bài: các đoạn văn và khối trích dẫn được dựng an toàn bằng DOM. -->
            <div class="post-body" data-body>
              <span class="u-placeholder-bar"></span>
              <span class="u-placeholder-bar"></span>
              <span class="u-placeholder-bar u-placeholder-bar--short"></span>
            </div>

            <hr class="post-divider" />

            <!-- Ba nút thao tác: thích (đếm cảm xúc thật), lưu bài và chia sẻ liên kết. -->
            <div class="post-actions" role="group" aria-label="Thao tác với bài viết">
              <button type="button" class="post-pill" data-like aria-pressed="false" disabled>
                <svg class="post-pill__icon post-pill__icon--heart" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M10 17.0833C10 17.0833 3.91667 13.3333 2.25 9.58333C1.08333 6.83333 2.83333 3.75 5.91667 3.75C7.58333 3.75 8.83333 4.66667 10 6.08333C11.1667 4.66667 12.4167 3.75 14.0833 3.75C17.1667 3.75 18.9167 6.83333 17.75 9.58333C16.0833 13.3333 10 17.0833 10 17.0833Z"/></svg>
                <span data-like-count>–</span>
                <span class="u-visually-hidden">lượt thích</span>
              </button>
              <button type="button" class="post-pill" data-bookmark aria-pressed="false" disabled>
                <svg class="post-pill__icon post-pill__icon--bookmark" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M5.41667 2.91667H14.5833V17.0833L10 13.9167L5.41667 17.0833V2.91667Z"/></svg>
                <span data-bookmark-label>Lưu</span>
              </button>
              <button type="button" class="post-pill" data-share disabled>
                <svg class="post-pill__icon" viewBox="0 0 20 20" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="15" cy="4.58" r="2.08"/><circle cx="5" cy="10" r="2.08"/><circle cx="15" cy="15.42" r="2.08"/><path d="m6.8 11.05 6.4 3.32M13.2 5.63 6.8 8.95"/></svg>
                <span>Chia sẻ</span>
              </button>
              <p class="post-actions__status" role="status" data-action-status></p>
            </div>

            <hr class="post-divider" />

            <!-- Thảo luận: tiêu đề có số bình luận thật, chọn thứ tự, danh sách và ô viết. -->
            <section class="post-discussion" aria-labelledby="discussion-title">
              <div class="post-discussion__head">
                <div class="post-discussion__title-row">
                  <h2 id="discussion-title" class="t-display post-discussion__title">Thảo luận (<span data-comment-count>–</span>)</h2>
                  <!-- Nhãn "Đã khoá bình luận" khi tác giả hoặc staff khoá bình luận. -->
                  <span data-locked-badge></span>
                </div>
                <label class="post-discussion__sort">
                  <span class="u-visually-hidden">Thứ tự bình luận</span>
                  <select class="post-discussion__select" data-comment-sort>
                    <option value="newest">Mới nhất</option>
                    <option value="oldest">Cũ nhất</option>
                  </select>
                </label>
              </div>

              <div class="post-comments" data-comments aria-live="polite">
                <p class="post-comments__note">Đang tải bình luận…</p>
              </div>

              <!-- Ô viết bình luận: chưa đăng nhập thì nút Gửi đưa tới trang đăng nhập. -->
              <form class="post-comment-form" data-comment-form novalidate>
                <label class="u-visually-hidden" for="comment-input">Viết bình luận</label>
                <input id="comment-input" class="input post-comment-form__input" name="content" type="text" maxlength="2000" autocomplete="off" placeholder="Chia sẻ cảm nhận của bạn…" aria-describedby="comment-hint" data-comment-input />
                <button type="submit" class="btn btn--primary post-comment-form__submit" data-comment-submit disabled>Gửi</button>
                <p id="comment-hint" class="field__hint post-comment-form__hint" data-comment-hint></p>
              </form>
              <p class="alert alert--info post-discussion__notice" role="status" data-comment-notice hidden></p>
            </section>
          </article>

          <!-- Cột phải: bốn thẻ có dải đỏ và cổng torii nhỏ như Figma. -->
          <aside class="post-sidebar" aria-label="Thông tin thêm">
            <!-- Về tác giả: tên, giới thiệu, số bài và người theo dõi, nút theo dõi. -->
            <section class="post-side-card" aria-labelledby="side-author-title">
              <h2 id="side-author-title" class="post-side-card__band">
                <img src="/assets/icons/torii-mini-small.svg" width="24" height="20" alt="" />
                Về tác giả
              </h2>
              <div class="post-side-card__body" data-side-author>
                <span class="u-placeholder-bar u-placeholder-bar--title"></span>
                <span class="u-placeholder-bar"></span>
                <span class="u-placeholder-bar u-placeholder-bar--short"></span>
              </div>
            </section>

            <!-- Địa điểm văn hoá: chỉ hiện khi bài có toạ độ; bản đồ là hình minh hoạ tĩnh. -->
            <section class="post-side-card" aria-labelledby="side-place-title" data-side-place-card hidden>
              <h2 id="side-place-title" class="post-side-card__band">
                <img src="/assets/icons/torii-mini-small.svg" width="24" height="20" alt="" />
                Địa điểm văn hóa
              </h2>
              <div class="post-side-card__body" data-side-place></div>
            </section>

            <!-- Bài viết liên quan: tối đa ba bài cùng chủ đề. -->
            <section class="post-side-card" aria-labelledby="side-related-title">
              <h2 id="side-related-title" class="post-side-card__band">
                <img src="/assets/icons/torii-mini-small.svg" width="24" height="20" alt="" />
                Bài viết liên quan
              </h2>
              <div class="post-side-card__body post-related" data-side-related>
                <span class="u-placeholder-bar u-placeholder-bar--title"></span>
                <span class="u-placeholder-bar u-placeholder-bar--short"></span>
              </div>
            </section>

            <!-- Chủ đề liên quan: tag thật của bài, bấm vào mở trang tìm kiếm với tag đó. -->
            <section class="post-side-card" aria-labelledby="side-topics-title">
              <h2 id="side-topics-title" class="post-side-card__band">
                <img src="/assets/icons/torii-mini-small.svg" width="24" height="20" alt="" />
                Chủ đề liên quan
              </h2>
              <div class="post-side-card__body post-topics" data-side-topics>
                <span class="u-placeholder-bar u-placeholder-bar--short"></span>
              </div>
            </section>
          </aside>
        </div>
      </div>
    </main>

    <!-- Footer đầy đủ dùng chung cho trang nội dung. -->
    <footer class="site-footer" data-component="footer" data-variant="full"></footer>
  </body>
</html>
